# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4b0b18e4abb15c4a75683c7fc32d2b44"
name = "fabricvton"
application_url = "https://fabricvton-api.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  # NOTE: orders/create is intentionally NOT subscribed. Its payload is protected
  # customer data, which this app has not requested access to.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# This app requires no Admin API access scopes. The storefront widget reads product
# data from Liquid, and the only Admin API calls are billing queries
# (currentAppInstallation / appSubscriptionCancel / appUsageRecordCreate), none of
# which are scope-gated. Do not add scopes here unless code actually uses them —
# unused scopes fail App Store review.
scopes = ""
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://fabricvton-api.onrender.com/auth/callback",
  "https://fabricvton-api.onrender.com/auth/shopify/callback",
  "https://fabricvton-api.onrender.com/api/auth/callback"
]

[app_proxy]
url = "https://fabricvton-api.onrender.com/proxy"
subpath = "fabricvton"
prefix = "apps"

[pos]
embedded = true
