name: Deploy to AWS production

# Every push to main deploys the apps whose files changed, like staging does.
# Can also be started by hand (Actions > Deploy to AWS production > Run
# workflow) with a list of apps. Runs in the GitHub "production" environment,
# which is also the only identity the prod deploy role trusts; give that
# environment required reviewers to approve each deploy with one click.
on:
  push:
    branches: [main]
    paths:
      - fabricvton/**
      - custom-store/**
      - admin-dashboard/**
      - fabricvton-newsite/**
      - fabricvton-nextjs/**
      - infra/scripts/deploy.sh
      - .github/workflows/deploy-prod.yml
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to deploy (space-separated)"
        default: "api portal admin newsite www"
        required: true

permissions:
  id-token: write
  contents: read

# Shared with the other environment's workflow: staging and production run on
# one Fargate quota, and two deploys at once can exceed it.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the repository variable PROD_DEPLOY_ENABLED=true
    # (Settings > Secrets and variables > Actions > Variables).
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to compare against what each app runs now
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::251929332238:role/clothsy-prod-github-deploy
          aws-region: us-east-1
      - name: Apps to deploy
        id: apps
        env:
          CHOSEN: ${{ inputs.apps }}
        run: |
          # By hand: the apps asked for. On push: every app whose files differ
          # from the commit its running image was built from (image tags are
          # prod-<commit>[-dirty-…]). Comparing with what is live, not with the
          # previous push, means a queued run that GitHub drops can't leave a
          # change undeployed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$CHOSEN"
          else
            declare -A DIR=([api]=fabricvton [portal]=custom-store [admin]=admin-dashboard [newsite]=fabricvton-newsite [www]=fabricvton-nextjs)
            account="$(aws sts get-caller-identity --query Account --output text)"
            apps=""
            for app in api portal admin newsite www; do
              image="$(aws ecs describe-express-gateway-service --region us-east-1 \
                --service-arn "arn:aws:ecs:us-east-1:$account:service/clothsy-prod/clothsy-prod-$app" \
                --query 'max_by(service.activeConfigurations, &createdAt).primaryContainer.image' --output text 2>/dev/null || true)"
              live="$(printf '%s' "$image" | sed -n 's/.*:prod-\([0-9a-f]\{12\}\).*/\1/p')"
              if [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
                echo "$app: live commit unknown ($image), deploying"; apps="$apps $app"
              elif [ -n "$(git diff --name-only "$live" HEAD -- "${DIR[$app]}" infra/scripts/deploy.sh)" ]; then
                echo "$app: changed since $live, deploying"; apps="$apps $app"
              else
                echo "$app: live $live is current"
              fi
            done
          fi
          apps="$(echo $apps)"
          echo "Deploying: ${apps:-nothing}"
          echo "list=$apps" >> "$GITHUB_OUTPUT"
      - name: Backend tests
        if: steps.apps.outputs.list != ''
        working-directory: fabricvton
        run: npx -y tsx --test test/*.test.ts
      - name: Build, push, migrate, deploy
        if: steps.apps.outputs.list != ''
        run: bash infra/scripts/deploy.sh prod ${{ steps.apps.outputs.list }}
